# ============================================================
# deploy-staging.yml
# Triggers on every push to the `staging` branch.
#
# PIPELINE SHAPE
# ──────────────
#   infra ──────────────┐
#                       ▼
#   build ──────────▶ deploy ──▶ smoke-test
#
# AZURE TARGET
# ────────────
#   buy-with-buddies-staging.azurewebsites.net
#   Resource group: rg-buy-with-buddies-staging
#
# SECRETS (set in GitHub → Settings → Environments → staging)
# ────────────────────────────────────────────────────────────
#   AZURE_RESOURCE_GROUP         → rg-shoppingapp
#   AZURE_WEBAPP_NAME            → buy-with-buddies-staging
#   AZURE_WEBAPP_PUBLISH_PROFILE → publish profile for the staging App Service
#
# SECRETS (set at repository level)
# ────────────────────────────────────────────────────────────
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY
# ============================================================

name: Deploy → Staging

permissions:
  id-token: write   # required for OIDC Azure login
  contents: read

on:
  push:
    branches: [staging]
  workflow_dispatch:

env:
  BUILD_OUTPUT_DIR: '.output'

jobs:
  # ----------------------------------------------------------
  # JOB 1a: Infrastructure (Bicep) — idempotent
  # ----------------------------------------------------------
  infra:
    name: Infrastructure (Bicep)
    runs-on: ubuntu-latest
    environment:
      name: staging

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Bicep (idempotent)
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az deployment group create \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --template-file infra/main.bicep \
              --parameters infra/main.staging.bicepparam \
              --mode Incremental

  # ----------------------------------------------------------
  # JOB 1b: Build — runs in parallel with infra
  # ----------------------------------------------------------
  build:
    name: Build (SSR)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build SSR app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          bun run build
          npx nitro build

      - name: Debug output
        run: |
          echo "After Nitro build:"
          ls -la
          ls -la .output || echo ".output missing"

      - name: Verify build output
        run: |
           test -f ${{ env.BUILD_OUTPUT_DIR }}/server/index.mjs \
           && echo "Nitro server: EXISTS" \
           || (echo "Nitro server: MISSING" && ls -la ${{ env.BUILD_OUTPUT_DIR }}/ && exit 1)

      - name: Debug filesystem before upload
        run: |
          echo "PWD:"
          pwd
          echo "Root contents:"
          ls -la
          echo "Looking for .output everywhere:"
          find . -type d -name ".output" || true
           
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: staging-build-${{ github.sha }}
          path: ${{ env.BUILD_OUTPUT_DIR }}
          include-hidden-files: "true"
          if-no-files-found: error
          retention-days: 3
 
  # ----------------------------------------------------------
  # JOB 2: Deploy to staging App Service
  # ----------------------------------------------------------
  deploy-staging:
    name: Deploy → Staging
    runs-on: ubuntu-latest
    needs: [infra, build]
    environment:
      name: staging
      url: https://buy-with-buddies-staging.azurewebsites.net

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: staging-build-${{ github.sha }}
          path: ${{ env.BUILD_OUTPUT_DIR }}

      - name: Deploy to staging App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.BUILD_OUTPUT_DIR }}

  # ----------------------------------------------------------
  # JOB 3: Smoke test
  # ----------------------------------------------------------
  smoke-test:
    name: Smoke Test (staging)
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment:
      name: staging

    steps:
      - name: Smoke test (retry up to 3 min)
        run: |
          URL="https://${{ secrets.AZURE_WEBAPP_NAME }}.azurewebsites.net"
          for i in $(seq 1 18); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
            echo "Attempt $i/18 — HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then echo "Smoke test PASSED" && exit 0; fi
            sleep 10
          done
          echo "Smoke test FAILED" && exit 1
