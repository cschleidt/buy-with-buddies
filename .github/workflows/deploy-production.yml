# ============================================================
# deploy-production.yml
# Triggers on every push to `main` (i.e., when staging PR is merged).
#
# PIPELINE SHAPE
# ──────────────
#   infra ──────────────┐
#                       ▼
#   build ──────────▶ deploy ──▶ smoke-test
#
# AZURE TARGET
# ────────────
#   buy-with-buddies-production.azurewebsites.net
#   Resource group: rg-buy-with-buddies-production
#
# SECRETS (set in GitHub → Settings → Environments → production)
# ──────────────────────────────────────────────────────────────
#   AZURE_RESOURCE_GROUP         → rg-buy-with-buddies-production
#   AZURE_WEBAPP_NAME            → buy-with-buddies-production
#   AZURE_WEBAPP_PUBLISH_PROFILE → publish profile for the production App Service
#
# SECRETS (set at repository level)
# ────────────────────────────────────────────────────────────
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY
# ============================================================

name: Deploy → Production

permissions:
  id-token: write   # required for OIDC Azure login
  contents: read

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  BUILD_OUTPUT_DIR: '.output'

jobs:
  # ----------------------------------------------------------
  # JOB 1a: Infrastructure (Bicep) — idempotent
  # ----------------------------------------------------------
  infra:
    name: Infrastructure (Bicep)
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Bicep (idempotent)
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az deployment group create \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --template-file infra/main.bicep \
              --parameters infra/main.production.bicepparam \
              --mode Incremental

  # ----------------------------------------------------------
  # JOB 1b: Build — runs in parallel with infra
  # ----------------------------------------------------------
  build:
    name: Build (SSR)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build SSR app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          bun run build
          npx nitro build

      - name: Verify build output
        run: |
          test -f ${{ env.BUILD_OUTPUT_DIR }}/server/index.mjs \
            && echo "Server entry: EXISTS" \
            || (echo "Server entry: MISSING" && ls -la ${{ env.BUILD_OUTPUT_DIR }}/ && exit 1)

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-build-${{ github.sha }}
          path: ${{ env.BUILD_OUTPUT_DIR }}
          include-hidden-files: "true"
          if-no-files-found: error
          retention-days: 7

  # ----------------------------------------------------------
  # JOB 2: Deploy to production App Service
  # ----------------------------------------------------------
  deploy-production:
    name: Deploy → Production
    runs-on: ubuntu-latest
    needs: [infra, build]
    environment:
      name: production
      url: https://buy-with-buddies-production.azurewebsites.net

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: production-build-${{ github.sha }}
          path: artifact

      - name: Deploy to production App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: artifact

  # ----------------------------------------------------------
  # JOB 3: Smoke test
  # ----------------------------------------------------------
  smoke-test:
    name: Smoke Test (production)
    runs-on: ubuntu-latest
    needs: deploy-production
    environment:
      name: production

    steps:
      - name: Smoke test (retry up to 3 min)
        run: |
          URL="https://${{ secrets.AZURE_WEBAPP_NAME }}.azurewebsites.net"
          for i in $(seq 1 18); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
            echo "Attempt $i/18 — HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then echo "Smoke test PASSED" && exit 0; fi
            sleep 10
          done
          echo "Smoke test FAILED" && exit 1
